apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app.kubernetes.io/name: vr-platform-server
    app.kubernetes.io/part-of: vr-platform
spec:
  # Each process has its own directory. Never overlap replicas during rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vr-platform-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vr-platform-server
        app.kubernetes.io/part-of: vr-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: nix:0/nix/store/fa10mx0x0fhg43ma33gk9n1zp650kz4h-nix-image-vr-platform-server.tar
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
