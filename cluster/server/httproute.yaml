apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server
spec:
  parentRefs:
    - name: gateway
      namespace: ingress
  hostnames:
    - api.vr.maio-tech.com
    - vr-api-origin.svc.maio-tech.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: server
          port: 8080
