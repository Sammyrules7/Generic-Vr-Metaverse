# TURN relay for WebRTC clients behind symmetric NATs.
#
# SCALING WARNING: keep replicas: 1. TURN allocations live in process memory
# and coturn shares none between instances. Two clients that land on different
# pods cannot relay to each other (the far NAT drops cross-instance packets),
# so scaling this deployment BREAKS relayed calls instead of adding capacity.
# A restart drops active relayed sessions; clients renegotiate automatically
# (see RoomNetworking transport recovery) and re-allocate within seconds.
# P2P clients never touch this process and are unaffected by restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  labels:
    app.kubernetes.io/name: vr-platform-turn
    app.kubernetes.io/part-of: vr-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vr-platform-turn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vr-platform-turn
        app.kubernetes.io/part-of: vr-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: docker.io/coturn/coturn:4.18.0-r0-debian
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/coturn/turnserver.conf"
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: turn-tcp
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: turn-tcp
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          secret:
            secretName: turn-config
            items:
              - key: turnserver.conf
                path: turnserver.conf
