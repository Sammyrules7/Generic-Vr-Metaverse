name: Build server container

on:
  push:
    branches: [main, Multiplayer]
    paths:
      - Server/**
      - cluster/server/**
      - flake.nix
      - flake.lock
      - .forgejo/workflows/Server-container.yaml
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://install.determinate.systems/nix/nix-installer-x86_64-linux \
            --output /tmp/nix-installer
          chmod +x /tmp/nix-installer
          sudo /tmp/nix-installer install linux \
            --no-confirm \
            --init none \
            --extra-conf 'trusted-users = root'

          sudo setsid --fork /nix/var/nix/profiles/default/bin/nix-daemon \
            </dev/null >/tmp/nix-daemon.log 2>&1
          for attempt in $(seq 1 30); do
            test -S /nix/var/nix/daemon-socket/socket && break
            sleep 1
          done
          test -S /nix/var/nix/daemon-socket/socket

          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
          echo NIX_REMOTE=daemon >> "$GITHUB_ENV"

      - name: Build and cache Nix images
        env:
          ATTIC_SERVER: https://attic.maio-tech.com
          ATTIC_CACHE: main
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run .#attic-client -- login ci "$ATTIC_SERVER" "$ATTIC_TOKEN"
          SERVER_IMAGE_PATH="$(nix build .#server-image --no-link --print-out-paths)"
          GODOT_IMAGE_PATH="$(nix build .#godot-ci-image --no-link --print-out-paths)"
          PUBLISH_IMAGE_PATH="$(nix build .#publish-ci-image --no-link --print-out-paths)"
          CLEANUP_IMAGE_PATH="$(nix build .#cleanup-ci-image --no-link --print-out-paths)"

          nix run .#attic-client -- push "$ATTIC_CACHE" \
            "$SERVER_IMAGE_PATH" \
            "$GODOT_IMAGE_PATH" \
            "$PUBLISH_IMAGE_PATH" \
            "$CLEANUP_IMAGE_PATH"

          sed -i -E "s|image: nix:0/nix/store/[^ ]+-nix-image-vr-platform-server.tar|image: nix:0$SERVER_IMAGE_PATH|" cluster/server/deployment.yaml
          sed -i -E "s|image: nix:0/nix/store/[^ ]+-nix-image-vr-platform-godot-ci.tar|image: nix:0$GODOT_IMAGE_PATH|" \
            .forgejo/workflows/Build-and-release.yaml \
            .forgejo/workflows/Web-preview.yaml
          sed -i -E "s|image: nix:0/nix/store/[^ ]+-nix-image-vr-platform-publish-ci.tar|image: nix:0$PUBLISH_IMAGE_PATH|" \
            .forgejo/workflows/Build-and-release.yaml
          sed -i -E "s|image: nix:0/nix/store/[^ ]+-nix-image-vr-platform-cleanup-ci.tar|image: nix:0$CLEANUP_IMAGE_PATH|" \
            .forgejo/workflows/Web-preview-cleanup.yaml

          if ! git diff --quiet; then
            git config user.name "Forgejo Actions"
            git config user.email "actions@forgejo.maio-tech.com"
            git add cluster/server/deployment.yaml .forgejo/workflows/*.yaml
            git commit -m "Update Nix image references [skip ci]"
            git push origin "HEAD:${FORGEJO_REF_NAME}"
          fi
