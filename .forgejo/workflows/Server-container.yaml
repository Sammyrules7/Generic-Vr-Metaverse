name: Build server container

on:
  push:
    branches: [main, Multiplayer]
    paths:
      - Server/**
      - cluster/server/**
      - .forgejo/workflows/Server-container.yaml
  workflow_dispatch:

env:
  IMAGE: forgejo.maio-tech.com/sammy/generic-vr-platform-server

jobs:
  publish:
    name: Build and publish
    runs-on: default
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      - name: Authenticate to Forgejo packages
        env:
          REGISTRY_USER: ${{ forgejo.actor }}
          REGISTRY_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p /kaniko/.docker
          AUTH="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"forgejo.maio-tech.com":{"auth":"%s"}}}\n' "$AUTH" > /kaniko/.docker/config.json

      - name: Build and push
        run: |
          /kaniko/executor \
            --context "git://forgejo.maio-tech.com/Sammy/Generic-Vr-Platform.git#refs/heads/${FORGEJO_REF_NAME}#${FORGEJO_SHA}" \
            --context-sub-path Server \
            --dockerfile Dockerfile \
            --destination "${IMAGE}:latest" \
            --destination "${IMAGE}:${FORGEJO_SHA}"
