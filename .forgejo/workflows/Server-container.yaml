name: Build server container

on:
  push:
    branches: [main, Multiplayer]
    paths:
      - Server/**
      - cluster/server/**
      - flake.nix
      - flake.lock
      - .forgejo/workflows/Server-container.yaml
  workflow_dispatch:

env:
  IMAGE: forgejo.maio-tech.com/sammy/generic-vr-platform-server

jobs:
  publish:
    name: Build and publish
    runs-on: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://install.determinate.systems/nix/nix-installer-x86_64-linux \
            --output /tmp/nix-installer
          chmod +x /tmp/nix-installer
          sudo /tmp/nix-installer install linux \
            --no-confirm \
            --init none \
            --extra-conf 'trusted-users = root'

          sudo setsid --fork /nix/var/nix/profiles/default/bin/nix-daemon \
            </dev/null >/tmp/nix-daemon.log 2>&1
          for attempt in $(seq 1 30); do
            test -S /nix/var/nix/daemon-socket/socket && break
            sleep 1
          done
          test -S /nix/var/nix/daemon-socket/socket

          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
          echo NIX_REMOTE=daemon >> "$GITHUB_ENV"

      - name: Authenticate to Forgejo packages
        env:
          REGISTRY_USER: ${{ forgejo.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          AUTH="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"forgejo.maio-tech.com":{"auth":"%s"}}}\n' "$AUTH" > "$HOME/.docker/config.json"

      - name: Build, cache, and publish
        env:
          ATTIC_SERVER: https://attic.maio-tech.com
          ATTIC_CACHE: main
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run .#attic-client -- login ci "$ATTIC_SERVER" "$ATTIC_TOKEN"
          IMAGE_PATH="$(nix build .#server-image --no-link --print-out-paths)"
          nix run .#attic-client -- push "$ATTIC_CACHE" "$IMAGE_PATH"

          nix run .#publish-server-image -- \
            "${IMAGE}:latest" \
            "${IMAGE}:${FORGEJO_SHA}"
