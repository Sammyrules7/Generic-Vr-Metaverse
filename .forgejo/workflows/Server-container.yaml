name: Build Nix images

on:
  push:
    branches: [main, Multiplayer]
    paths:
      - Server/**
      - cluster/server/**
      - flake.nix
      - flake.lock
      - nix/images/**
      - scripts/update_ci_images.sh
      - .forgejo/workflows/Server-container.yaml
  workflow_dispatch:

concurrency:
  group: nix-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: nix
    container:
      image: nix:0/nix/store/8gkw0nrmwykp4yhcic8x96a5g63hrf74-nix-image-vr-platform-builder-ci.tar
    steps:
      # The Forgejo runner already cloned the code without game assets, so no
      # checkout step is needed. No GitHub actions: keep act-runner native.

      - name: Select images
        id: images
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_COMMIT: ${{ github.event.before }}
        run: |
          scope=all
          # Compare the whole push, not just HEAD^ (pushes can contain many commits).
          # Missing history, a new branch, and manual runs safely build everything.
          if [[ "$EVENT_NAME" == push && "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ && "$BASE_COMMIT" != 0000000000000000000000000000000000000000 ]]; then
            if git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_COMMIT"; then
              if git diff --quiet "$BASE_COMMIT" HEAD -- flake.nix flake.lock nix/images scripts/update_ci_images.sh .forgejo/workflows/Server-container.yaml; then
                scope=server
              fi
            fi
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

      - name: Build and cache selected images
        shell: bash
        env:
          ATTIC_SERVER: https://attic.maio-tech.com
          ATTIC_CACHE: main
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          IMAGE_SCOPE: ${{ steps.images.outputs.scope }}
        run: |
          nix run .#attic-client -- login ci "$ATTIC_SERVER" "$ATTIC_TOKEN"
          bash scripts/update_ci_images.sh "$IMAGE_SCOPE"

      - name: Commit updated image references
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          generated_files=(cluster/server/deployment.yaml .forgejo/workflows/Build-and-release.yaml .forgejo/workflows/Server-container.yaml .forgejo/workflows/Web-preview.yaml .forgejo/workflows/Web-preview-cleanup.yaml .forgejo/workflows/Worker-deploy.yaml)
          if git diff --quiet -- "${generated_files[@]}"; then exit 0; fi
          git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH_NAME"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_COMMIT" ]]; then
            echo 'Branch advanced during the build; skipping stale image references. Run this workflow on the latest commit to refresh them.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.maio-tech.com"
          git add -- "${generated_files[@]}"
          git commit -m "Update Nix image references [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
