name: Build server container

on:
  push:
    branches: [main, Multiplayer]
    paths:
      - Server/**
      - cluster/server/**
      - flake.nix
      - flake.lock
      - .forgejo/workflows/Server-container.yaml
  workflow_dispatch:

env:
  IMAGE: forgejo.maio-tech.com/sammy/generic-vr-platform-server

jobs:
  publish:
    name: Build and publish
    runs-on: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        uses: https://github.com/NixOS/nix-installer-action@v1

      - name: Authenticate to Forgejo packages
        env:
          REGISTRY_USER: ${{ forgejo.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          AUTH="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"forgejo.maio-tech.com":{"auth":"%s"}}}\n' "$AUTH" > "$HOME/.docker/config.json"

      - name: Build, cache, and publish
        env:
          ATTIC_SERVER: ${{ vars.ATTIC_SERVER }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run .#attic-client -- login ci "$ATTIC_SERVER" "$ATTIC_TOKEN"
          IMAGE_PATH="$(nix build .#server-image --no-link --print-out-paths)"
          nix run .#attic-client -- push "$ATTIC_CACHE" "$IMAGE_PATH"

          nix run .#publish-server-image -- \
            "${IMAGE}:latest" \
            "${IMAGE}:${FORGEJO_SHA}"
