name: Build and release clients

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
    paths:
      - Godot/**
      - '!Godot/**/*.md'
      - .itch.toml
      - .forgejo/workflows/Build-and-release.yaml
  workflow_dispatch:

env:
  EXPORT_NAME: generic-vr-metaverse
  PROJECT_PATH: Godot
  EXPORT_DIR: ${{ github.workspace }}/build
  GRADLE_USER_HOME: ${{ github.workspace }}/build/gradle

  ITCH_USER: sammyrules7
  ITCH_GAME: generic-vr-metaverse

jobs:
  export-all:
    name: 🛠️ Build and release
    runs-on: default
    container:
      # The image bundles godot, export templates, the Android SDK, and butler.
      # Updated automatically from the flake by Server-container.yaml.
      image: nix:0/nix/store/867qfbad24q0xhj1wqws5fbvb94fray0-nix-image-vr-platform-godot-ci.tar
    steps:
      # This runner starts with an empty workspace, so clone explicitly with
      # the job token. No GitHub actions: this must stay act-runner native.
      - name: Checkout repository with large files
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          FETCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TOKEN="${FORGEJO_TOKEN:-$GITHUB_TOKEN}"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          mkdir -p /tmp
ci_home="$(mktemp -d /tmp/ci-home.XXXXXX)"
          mkdir -p "$ci_home/config" "$ci_home/data"
          # Godot writes user:// settings under XDG dirs that must be owned by
          # the uid; the image defaults point at root-owned /tmp paths here,
          # which breaks profile.cfg persistence in the tests.
          printf 'HOME=%s\nXDG_CONFIG_HOME=%s\nXDG_DATA_HOME=%s\n' \
            "$ci_home" "$ci_home/config" "$ci_home/data" >> "$GITHUB_ENV"
          export HOME="$ci_home"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q "$GITHUB_WORKSPACE"
          git remote add origin "$REPO_URL"
          git config "http.$REPO_URL.extraheader" "$header"
          # Configure the LFS smudge filter before the first checkout so
          # large files are materialized as real content.
          git lfs install --local
          git fetch -q --no-tags --depth=1 origin "$FETCH_REF"
          git checkout -qf --detach FETCH_HEAD
          git lfs pull

      - name: Read engine version
        id: engine
        run: printf 'version=%s\n' "$(godot --version)" >> "$GITHUB_OUTPUT"

      - name: Run Headless Import
        run: godot --headless --xr-mode off --editor --import --path "$PROJECT_PATH"

      - name: Test native voice codec and audiences
        run: |
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/voice_codec_test.gd
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/voice_audience_test.gd

      - name: Test player movement
        run: godot --headless --path ${{ env.PROJECT_PATH }} --xr-mode off --script res://tests/movement_test.gd

      - name: Test XR hand tracking and menu
        run: |
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/tracked_hand_test.gd
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/hand_menu_test.gd
          godot --headless --xr-mode off --path "$PROJECT_PATH" res://UI/tests/lobby_test.tscn

      - name: Configure release signaling endpoint
        env:
          VR_PLATFORM_SERVER_URL: ${{ vars.VR_PLATFORM_SERVER_URL }}
        run: godot --headless --xr-mode off --path ${{ env.PROJECT_PATH }} --script res://tools/configure_release.gd

      # --- LINUX BUILD ---
      - name: Build Linux Release
        run: |
          mkdir -p ${{ env.EXPORT_DIR }}/linux
          godot --headless --verbose --path ${{ env.PROJECT_PATH }} --export-release "Linux - Release" "${{ env.EXPORT_DIR }}/linux/${{ env.EXPORT_NAME }}.x86_64"

      # --- WINDOWS BUILD ---
      - name: Build Windows Release
        run: |
          mkdir -p ${{ env.EXPORT_DIR }}/windows
          godot --headless --verbose --path ${{ env.PROJECT_PATH }} --export-release "Windows - Release" "${{ env.EXPORT_DIR }}/windows/${{ env.EXPORT_NAME }}.exe"

      # --- ANDROID BUILD ---
      - name: Update Version
        run: |
          cd ${{ env.PROJECT_PATH }}
          VERSION_NAME="0.0.${{ github.run_number }}"
          sed -i "s/version\/code=.*/version\/code=${{ github.run_number }}/g" export_presets.cfg
          sed -i "s/version\/name=.*/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build Android Release
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ${{ env.EXPORT_DIR }}/android
          godot --headless --install-android-build-template --verbose --path ${{ env.PROJECT_PATH }} --export-release "Android - Release" "${{ env.EXPORT_DIR }}/android/${{ env.EXPORT_NAME }}.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      # --- ITCH.IO RELEASE ---
      # Runs inline in the same job so the exports never travel through a
      # GitHub-compatible artifact transfer.
      - name: Prepare Itch.io builds
        if: github.ref_name == 'main'
        run: |
          chmod +x "${{ env.EXPORT_DIR }}/linux/${{ env.EXPORT_NAME }}.x86_64"
          cp .itch.toml "${{ env.EXPORT_DIR }}/linux/.itch.toml"
          cp .itch.toml "${{ env.EXPORT_DIR }}/windows/.itch.toml"

      - name: Push Builds to Itch.io
        if: github.ref_name == 'main'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push "${{ env.EXPORT_DIR }}/linux" ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:linux
          butler push "${{ env.EXPORT_DIR }}/windows" ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows
          butler push "${{ env.EXPORT_DIR }}/android" ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:android
