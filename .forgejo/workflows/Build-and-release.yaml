name: Build and release clients

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
    paths:
      - Godot/**
      - '!Godot/**/*.md'
      - .itch.toml
      - .forgejo/workflows/Build-and-release.yaml
  workflow_dispatch:

env:
  EXPORT_NAME: generic-vr-metaverse
  PROJECT_PATH: Godot
  EXPORT_DIR: ${{ github.workspace }}/build
  GRADLE_USER_HOME: ${{ github.workspace }}/build/gradle

  ITCH_USER: sammyrules7
  ITCH_GAME: generic-vr-metaverse

jobs:
  export-all:
    name: 🛠️ Build
    runs-on: default
    container:
      image: nix:0/nix/store/87xj4fjc08nvn1ccr8ahyi1agx3j2gk8-nix-image-vr-platform-godot-ci.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Read engine version
        id: engine
        run: printf 'version=%s\n' "$(godot --version)" >> "$GITHUB_OUTPUT"

      - name: Cache .godot folder
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/.godot
          key: godot-native-v2-${{ steps.engine.outputs.version }}-${{ github.sha }}
          restore-keys: |
            godot-native-v2-${{ steps.engine.outputs.version }}-

      - name: Run Headless Import
        run: godot --headless --xr-mode off --editor --import --path "$PROJECT_PATH"

      - name: Test native voice codec and audiences
        run: |
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/voice_codec_test.gd
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/voice_audience_test.gd

      - name: Test player movement
        run: godot --headless --path ${{ env.PROJECT_PATH }} --xr-mode off --script res://tests/movement_test.gd

      - name: Test XR hand tracking and menu
        run: |
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/tracked_hand_test.gd
          godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/hand_menu_test.gd
          godot --headless --xr-mode off --path "$PROJECT_PATH" res://UI/tests/lobby_test.tscn

      - name: Configure release signaling endpoint
        env:
          VR_PLATFORM_SERVER_URL: ${{ vars.VR_PLATFORM_SERVER_URL }}
        run: godot --headless --xr-mode off --path ${{ env.PROJECT_PATH }} --script res://tools/configure_release.gd

      # --- LINUX BUILD ---
      - name: Build Linux Release
        run: |
          mkdir -p ${{ env.EXPORT_DIR }}/linux
          godot --headless --verbose --path ${{ env.PROJECT_PATH }} --export-release "Linux - Release" "${{ env.EXPORT_DIR }}/linux/${{ env.EXPORT_NAME }}.x86_64"

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Linux-Build
          path: ${{ env.EXPORT_DIR }}/linux

      # --- WINDOWS BUILD ---
      - name: Build Windows Release
        run: |
          mkdir -p ${{ env.EXPORT_DIR }}/windows
          godot --headless --verbose --path ${{ env.PROJECT_PATH }} --export-release "Windows - Release" "${{ env.EXPORT_DIR }}/windows/${{ env.EXPORT_NAME }}.exe"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Windows-Build
          path: ${{ env.EXPORT_DIR }}/windows

      # --- ANDROID BUILD ---
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-v2-${{ steps.engine.outputs.version }}-${{ hashFiles('flake.lock', 'Godot/export_presets.cfg') }}
          restore-keys: |
            gradle-v2-${{ steps.engine.outputs.version }}-

      - name: Update Version
        run: |
          cd ${{ env.PROJECT_PATH }}
          VERSION_NAME="0.0.${{ github.run_number }}"
          sed -i "s/version\/code=.*/version\/code=${{ github.run_number }}/g" export_presets.cfg
          sed -i "s/version\/name=.*/version\/name=\"$VERSION_NAME\"/g" export_presets.cfg

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build Android Release
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ${{ env.EXPORT_DIR }}/android
          godot --headless --install-android-build-template --verbose --path ${{ env.PROJECT_PATH }} --export-release "Android - Release" "${{ env.EXPORT_DIR }}/android/${{ env.EXPORT_NAME }}.apk"

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Android-Build
          path: ${{ env.EXPORT_DIR }}/android

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

  deploy-itch:
    name: 🚀 Deploy to Itch.io
    needs: export-all
    if: github.ref_name == 'main'
    runs-on: default
    container:
      image: nix:0/nix/store/h2p0j8r2zq171ljhyj9phhvfk7zxghn9-nix-image-vr-platform-publish-ci.tar
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Linux Build
        uses: actions/download-artifact@v3
        with:
          name: Linux-Build
          path: ${{ env.EXPORT_DIR }}/linux

      - name: Download Windows Build
        uses: actions/download-artifact@v3
        with:
          name: Windows-Build
          path: ${{ env.EXPORT_DIR }}/windows

      - name: Download Android Build
        uses: actions/download-artifact@v3
        with:
          name: Android-Build
          path: ${{ env.EXPORT_DIR }}/android

      - name: Decompress Gzipped Artifacts & Set Permissions
        run: |
          echo "Scanning for API-corrupted gzip files..."
          find "${{ env.EXPORT_DIR }}" -type f | while read -r filepath; do
            if file "$filepath" | grep -q "gzip compressed data"; then
              echo "Healing compressed file to its exact name: $filepath"
              mv "$filepath" "$filepath.gz"
              gunzip -c "$filepath.gz" > "$filepath"
              rm "$filepath.gz"
            fi
          done

          # Explicitly ensure the Linux executable has run permissions
          echo "Setting Linux executable permissions..."
          chmod +x "${{ env.EXPORT_DIR }}/linux/${{ env.EXPORT_NAME }}.x86_64"

      - name: Inject .itch.toml into Build Folders
        run: |
          cp .itch.toml ${{ env.EXPORT_DIR }}/linux/
          cp .itch.toml ${{ env.EXPORT_DIR }}/windows/

      - name: Push Builds to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push ${{ env.EXPORT_DIR }}/linux ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:linux
          butler push ${{ env.EXPORT_DIR }}/windows ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows
          butler push ${{ env.EXPORT_DIR }}/android ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:android
