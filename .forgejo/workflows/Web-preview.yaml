name: Web preview

on:
  push:
    branches:
      - Multiplayer
    paths:
      - Godot/**
      - .forgejo/workflows/Web-preview.yaml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build (blank uses the selected ref)
        required: false
        type: string
      publish_main:
        description: Publish this build at app.vr.maio-tech.com
        required: false
        default: false
        type: boolean

env:
  PROJECT_PATH: Godot
  EXPORT_DIR: ${{ github.workspace }}/build/web
  GARAGE_BUCKET: vr-platform-web
  GARAGE_ENDPOINT: https://s3.svc.maio-tech.com
  AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: garage
  CLOUDFLARE_ACCOUNT_ID: a92ab2f2ab0059485a5a45d61783b5da
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  web-preview:
    name: Build web preview
    runs-on: default
    outputs:
      commit: ${{ steps.describe.outputs.commit }}
      slug: ${{ steps.describe.outputs.slug }}
      publish_main: ${{ steps.describe.outputs.publish_main }}
    container:
      # Updated automatically from the flake by Server-container.yaml.
      image: nix:0/nix/store/y2h8p5vvnkjfd7qbv0i3m1d53ik8q5ln-nix-image-vr-platform-godot-web-ci.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true

      - name: Describe build
        id: describe
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
          REQUESTED_MAIN: ${{ inputs.publish_main }}
        run: |
          commit="$(git rev-parse HEAD)"
          branch="$REQUESTED_REF"
          slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-63)"
          if [ -z "$slug" ]; then slug="commit"; fi
          publish_main=false
          if [ "$REQUESTED_MAIN" = "true" ] || [ "$branch" = "main" ]; then publish_main=true; fi
          printf 'BUILD_COMMIT=%s\nBUILD_BRANCH=%s\nBUILD_SLUG=%s\nPUBLISH_MAIN=%s\n' "$commit" "$branch" "$slug" "$publish_main" >> "$GITHUB_ENV"
          printf 'commit=%s\nslug=%s\npublish_main=%s\n' "$commit" "$slug" "$publish_main" >> "$GITHUB_OUTPUT"

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/.godot
          key: godot-web-assets-${{ hashFiles('**/project.godot') }}
          restore-keys: godot-web-assets-

      - name: Import project
        run: godot --headless --editor --quit --path "$PROJECT_PATH"

      - name: Test player movement
        run: godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tests/movement_test.gd

      #- name: Test server address configuration
      #  run: godot --headless --xr-mode off --path "$PROJECT_PATH" res://Networking/tests/server_config_test.tscn

      - name: Configure main signaling backend
        env:
          VR_PLATFORM_SERVER_URL: ${{ vars.VR_PLATFORM_SERVER_URL }}
        run: godot --headless --xr-mode off --path "$PROJECT_PATH" --script res://tools/configure_release.gd

      - name: Export web client
        run: |
          mkdir -p "$EXPORT_DIR"
          godot --headless --verbose --path "$PROJECT_PATH" --export-release "Web - Preview" "$EXPORT_DIR/index.html"
          find "$EXPORT_DIR" -maxdepth 1 -type f -printf '%s %f\n' | sort -nr

      - name: Upload web client
        uses: actions/upload-artifact@v3
        with:
          name: Web-Preview
          path: ${{ env.EXPORT_DIR }}

  publish-preview:
    name: Publish web preview
    needs: web-preview
    runs-on: default
    container:
      # Updated automatically from the flake by Server-container.yaml.
      image: nix:0/nix/store/1fh64qhk5iva1idawvklmimsq9akiais-nix-image-vr-platform-web-publish-ci.tar
    env:
      BUILD_COMMIT: ${{ needs.web-preview.outputs.commit }}
      BUILD_SLUG: ${{ needs.web-preview.outputs.slug }}
      PUBLISH_MAIN: ${{ needs.web-preview.outputs.publish_main }}
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Download web client
        uses: actions/download-artifact@v3
        with:
          name: Web-Preview
          path: ${{ env.EXPORT_DIR }}

      - name: Decompress web client for HTTP range requests
        shell: bash
        run: |
          find "$EXPORT_DIR" -type f -print0 | while IFS= read -r -d '' asset; do
            if gzip -t "$asset" 2>/dev/null; then
              gzip -cd "$asset" > "$asset.uncompressed"
              mv "$asset.uncompressed" "$asset"
            fi
          done

      - name: Replace branch build in Garage
        shell: bash
        run: |
          prefix="s3://$GARAGE_BUCKET/branches/$BUILD_SLUG"
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" sync --delete "$EXPORT_DIR/" "$prefix/assets/"
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" cp --include "*.wasm" --content-type application/wasm "$EXPORT_DIR/" "$prefix/assets/"
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" cp --include "*.pck" --content-type application/octet-stream "$EXPORT_DIR/" "$prefix/assets/"
          printf '%s\n' "$BUILD_COMMIT" > /tmp/commit.txt
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" cp --content-type text/plain --cache-control no-cache /tmp/commit.txt "$prefix/commit.txt"

      - name: Publish main channel
        if: env.PUBLISH_MAIN == 'true'
        shell: bash
        run: |
          prefix="s3://$GARAGE_BUCKET/channels/main"
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" sync --delete "$EXPORT_DIR/" "$prefix/assets/"
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" cp --include "*.wasm" --content-type application/wasm "$EXPORT_DIR/" "$prefix/assets/"
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" cp --include "*.pck" --content-type application/octet-stream "$EXPORT_DIR/" "$prefix/assets/"
          printf '%s\n' "$BUILD_COMMIT" > /tmp/commit.txt
          s5cmd --endpoint-url "$GARAGE_ENDPOINT" cp --content-type text/plain --cache-control no-cache /tmp/commit.txt "$prefix/commit.txt"

      - name: Deploy Cloudflare build router
        run: wrangler deploy

      - name: Deploy Cloudflare build router
        run: npx --yes wrangler@4 deploy

      - name: Publish links
        shell: bash
        run: |
          preview_url="https://app.vr.maio-tech.com/$BUILD_SLUG/$BUILD_COMMIT/"
          {
            echo "## Web build published"
            echo
            echo "- Preview: $preview_url"
            if [ "$PUBLISH_MAIN" = "true" ]; then echo "- Main: https://app.vr.maio-tech.com/"; fi
            echo "- Backend: ${{ vars.VR_PLATFORM_SERVER_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url"
