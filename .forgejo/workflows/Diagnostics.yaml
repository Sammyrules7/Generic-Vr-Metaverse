name: Runner diagnostics
on:
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect runner state
    runs-on: default
    container:
      image: nix:0/nix/store/8gkw0nrmwykp4yhcic8x96a5g63hrf74-nix-image-vr-platform-builder-ci.tar
    steps:
      - name: Job token available as FORGEJO_TOKEN/GITHUB_TOKEN
        run: |
          env | grep -E '^(FORGEJO|GITHUB)_TOKEN' | sed 's/=.*/=***/'
          test -n "$FORGEJO_TOKEN" -o -n "$GITHUB_TOKEN" || { echo 'no job token env'; exit 1; }

      - name: Clone with job token
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          TOKEN="${FORGEJO_TOKEN:-$GITHUB_TOKEN}"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          mkdir -p "$HOME" /tmp
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$REPO_URL"
          git -C "$GITHUB_WORKSPACE" -c "http.$REPO_URL.extraheader=$header" fetch -q --no-tags --depth=1 origin Multiplayer
          git -C "$GITHUB_WORKSPACE" checkout -qf --detach FETCH_HEAD
          ls "$GITHUB_WORKSPACE" | head

      - name: LFS pull works
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          TOKEN="${FORGEJO_TOKEN:-$GITHUB_TOKEN}"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" -c "http.$REPO_URL.extraheader=$header" lfs pull

      - name: Push test on a throwaway ref (bot-commit pattern)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          TOKEN="${FORGEJO_TOKEN:-$GITHUB_TOKEN}"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" config user.name "Forgejo Actions"
          git -C "$GITHUB_WORKSPACE" config user.email "actions@forgejo.maio-tech.com"
          git -C "$GITHUB_WORKSPACE" commit -q --allow-empty -m "fj push test [skip ci]"
          git -C "$GITHUB_WORKSPACE" -c "http.$REPO_URL.extraheader=$header" push -q origin HEAD:refs/heads/ci-diagnostics-pushtest
          echo "push works"
