name: Delivery drift checks
on:
  push:
    branches: [main, Multiplayer]
    paths:
      - Godot/**
      - Server/**
      - Protocol/**
      - native-libraries.json
      - scripts/check_delivery.py
      - flake.nix
      - flake.lock
      - .gitattributes
      - .forgejo/workflows/Delivery-checks.yaml
  pull_request:
  workflow_dispatch:
jobs:
  drift:
    runs-on: nix
    steps:
      # This runner starts with an empty workspace, so clone explicitly with
      # the job token. No GitHub actions: this must stay act-runner native.
      - name: Checkout repository with large files
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          FETCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TOKEN="${FORGEJO_TOKEN:-$GITHUB_TOKEN}"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          mkdir -p "$HOME" /tmp
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q "$GITHUB_WORKSPACE"
          git remote add origin "$REPO_URL"
          git config "http.$REPO_URL.extraheader" "$header"
          git fetch -q --no-tags --depth=1 origin "$FETCH_REF"
          git checkout -qf --detach FETCH_HEAD
          git lfs pull
      - name: Check native libraries, world allowlist, LFS and generated protocol
        run: |
          nix develop --command bash -euo pipefail -c '
            python3 scripts/check_delivery.py
            godot --headless --xr-mode off --editor --import --path Godot
            bash Protocol/generate.sh
            git diff --exit-code -- Server/protocol/packets.pb.go Godot/Networking/Generated/Packets.gd
            godot --headless --xr-mode off --path Godot res://tests/world_loading_test.tscn
          '
