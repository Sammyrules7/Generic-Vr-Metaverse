name: Remove deleted branch web preview

on:
  delete:

env:
  GARAGE_BUCKET: vr-platform-web
  GARAGE_ENDPOINT: https://s3.svc.maio-tech.com
  AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: garage

jobs:
  remove-preview:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    name: Remove branch preview
    runs-on: default
    container:
      image: debian:stable-slim
    steps:
      - name: Install Garage client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends awscli ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Remove branch build
        shell: bash
        env:
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          slug="$(printf '%s' "$DELETED_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-63)"
          test -n "$slug"
          aws --endpoint-url "$GARAGE_ENDPOINT" s3 rm "s3://$GARAGE_BUCKET/branches/$slug/" --recursive
