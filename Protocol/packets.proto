syntax = "proto3";

option go_package = "vr.maio-tech.com/server/protocol;protocol";

message ClientPacket {
  oneof payload {
    ClientRoomCreate room_create = 1;
    ClientRoomJoin room_join = 2;
    ClientRoomLeave room_leave = 3;
    ClientRelay relay = 4;
  }
  // Nonzero for room commands; echoed on their success or error reply.
  uint32 request_id = 10;
}

message ServerPacket {
  oneof payload {
    ClientConnected connected = 1;
    ServerRoomList room_list = 2;
    ServerRoomUpdated room_updated = 3;
    ServerRoomRemoved room_removed = 4;
    ServerRoomJoined room_joined = 5;
    ServerRoomLeft room_left = 6;
    ServerPeerJoined peer_joined = 7;
    ServerPeerLeft peer_left = 8;
    ServerRelay relay = 9;
    ServerError error = 10;
  }
  uint32 request_id = 11;
}

message Room {
  uint32 id = 1;
  string name = 2;
  uint32 player_count = 3;
  string world_id = 4;
  // Public lists carry an incarnation nonce; join replies carry a signed
  // per-member recovery capability. Preserve the join reply value for recovery.
  string recovery_token = 5;
}

// A session changes every time a client enters a room, including rejoining it.
message Peer {
  uint32 id = 1;
  uint32 session_id = 2;
}

message ClientRoomCreate { string name = 1; string world_id = 2; }
message ClientRoomJoin {
  uint32 room_id = 1;
  // Present only when restoring a P2P session after signaling reconnects.
  Room recovery_room = 2;
  uint32 client_id = 3;
  uint32 session_id = 4;
}
message ClientRoomLeave {}

message ClientRelay {
  uint32 destination_id = 1;
  oneof signal {
    WebRTCSessionDescription description = 2;
    WebRTCIceCandidate candidate = 3;
  }
  uint32 sender_session_id = 4;
  uint32 destination_session_id = 5;
}

message ClientConnected { uint32 client_id = 1; }
message ServerRoomList { repeated Room rooms = 1; }
message ServerRoomUpdated { Room room = 1; }
message ServerRoomRemoved { uint32 room_id = 1; }

message ServerRoomJoined {
  Room room = 1;
  repeated Peer peers = 2;
  uint32 session_id = 3;
  // Ephemeral TURN credentials minted for this membership. Empty when the
  // server has no relay configured (direct/STUN-only mesh). Survives coturn
  // restarts: the shared secret persists, so re-offers reuse these until TTL.
  TurnCredentials turn = 4;
}

// Username embeds expiry (unix seconds); password is
// base64(HMAC-SHA1(shared_secret, username)). Standard TURN REST API.
message TurnCredentials {
  repeated string urls = 1;
  string username = 2;
  string password = 3;
  // Seconds the credentials stay valid. Clients must rejoin (refreshing them)
  // before expiry; there is no separate refresh command.
  uint32 ttl = 4;
}

message ServerRoomLeft {}
message ServerPeerJoined { Peer peer = 1; }
message ServerPeerLeft {
  uint32 peer_id = 1;
  // Loss of signaling is not an instruction to close an established P2P link.
  bool signaling_disconnected = 2;
}

message ServerRelay {
  uint32 sender_id = 1;
  oneof signal {
    WebRTCSessionDescription description = 2;
    WebRTCIceCandidate candidate = 3;
  }
  uint32 sender_session_id = 4;
  uint32 destination_session_id = 5;
}

message WebRTCSessionDescription {
  string type = 1;
  string sdp = 2;
}

message WebRTCIceCandidate {
  string media = 1;
  int32 index = 2;
  string candidate = 3;
}

message ServerError { string reason = 1; }
