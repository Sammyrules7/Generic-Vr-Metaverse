syntax = "proto3";

option go_package = "vr.maio-tech.com/server/protocol;protocol";

message ClientPacket {
  oneof payload {
    ClientRoomCreate room_create = 1;
    ClientRoomJoin room_join = 2;
    ClientRoomLeave room_leave = 3;
    ClientRelay relay = 4;
  }
}

message ServerPacket {
  oneof payload {
    ClientConnected connected = 1;
    ServerRoomList room_list = 2;
    ServerRoomUpdated room_updated = 3;
    ServerRoomRemoved room_removed = 4;
    ServerRoomJoined room_joined = 5;
    ServerRoomLeft room_left = 6;
    ServerPeerJoined peer_joined = 7;
    ServerPeerLeft peer_left = 8;
    ServerRelay relay = 9;
    ServerError error = 10;
  }
}

message Room {
  uint32 id = 1;
  string name = 2;
  uint32 player_count = 3;
}

message ClientRoomCreate {
  string name = 1;
}

message ClientRoomJoin {
  uint32 room_id = 1;
}

message ClientRoomLeave {}

message ClientRelay {
  uint32 destination_id = 1;
  oneof signal {
    WebRTCSessionDescription description = 2;
    WebRTCIceCandidate candidate = 3;
  }
}

message ClientConnected {
  uint32 client_id = 1;
}

message ServerRoomList {
  repeated Room rooms = 1;
}

message ServerRoomUpdated {
  Room room = 1;
}

message ServerRoomRemoved {
  uint32 room_id = 1;
}

message ServerRoomJoined {
  Room room = 1;
  repeated uint32 peer_ids = 2;
}

message ServerRoomLeft {}

message ServerPeerJoined {
  uint32 peer_id = 1;
}

message ServerPeerLeft {
  uint32 peer_id = 1;
}

message ServerRelay {
  uint32 sender_id = 1;
  oneof signal {
    WebRTCSessionDescription description = 2;
    WebRTCIceCandidate candidate = 3;
  }
}

message WebRTCSessionDescription {
  string type = 1;
  string sdp = 2;
}

message WebRTCIceCandidate {
  string media = 1;
  int32 index = 2;
  string candidate = 3;
}

message ServerError {
  string reason = 1;
}
